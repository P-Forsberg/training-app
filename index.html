<!doctype html>
<html lang="sv" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1211" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Träning</title>
    <script>
      // Paint in the remembered theme before the app loads (no flash of the wrong colours).
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'night';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
